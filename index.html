<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllTrails QA Final Project – Manual Testing</title>
  <style>
    :root { --w: min(1000px, 95vw); }
    body { margin:0; font-family:system-ui, Arial, sans-serif; background:#f5f7fa; color:#2c3e50; }
    header { text-align:center; padding:20px 12px 10px; }
    h1 { margin:0 0 6px; font-size:clamp(20px, 2.6vw, 28px); }
    .btns { text-align:center; margin:8px 0 18px; }
    .btn {
      display:inline-block; padding:10px 16px; margin:6px; background:#2c3e50; color:#fff;
      text-decoration:none; border-radius:8px; font-weight:600;
    }
    .wrap { display:grid; place-items:center; }
    .viewer {
      width:var(--w); height:80vh; background:#fff; border:1px solid #d0d7de; border-radius:10px; overflow:hidden;
      box-shadow:0 2px 10px rgba(31,35,40,.08);
    }
    object, iframe { width:100%; height:100%; border:0; }
    .fallback { padding:18px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1>AllTrails QA Final Project – Manual Testing</h1>
    <div class="btns">
      <a class="btn" target="_blank"
         href="AllTrails%20QA%20Final%20Project%20%E2%80%93%20Manual%20Testing.pdf">
        View / Download PDF
      </a>
    </div>
  </header>

  <main class="wrap">
    <div class="viewer">
      <!-- primary embed -->
      <object
        data="AllTrails%20QA%20Final%20Project%20%E2%80%93%20Manual%20Testing.pdf#view=FitH"
        type="application/pdf">
        <!-- fallback 1 -->
        <iframe
          src="AllTrails%20QA%20Final%20Project%20%E2%80%93%20Manual%20Testing.pdf#view=FitH">
        </iframe>
        <!-- fallback 2 (visible only אם ההטמעה נכשלת) -->
        <div class="fallback">
          The PDF viewer couldn’t load.<br />
          <a class="btn" target="_blank"
             href="AllTrails%20QA%20Final%20Project%20%E2%80%93%20Manual%20Testing.pdf">
            Open the PDF in a new tab
          </a>
        </div>
      </object>
    </div>
  </main>
</body>
</html>
